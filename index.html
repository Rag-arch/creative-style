<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私という作風</title>
    <!-- html2canvas ライブラリ (画像ダウンロード機能用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-main: #111111;
            --text-sub: #666666;
            --border-color: #e0e0e0;
            --accent-color: #000000;
            --desc-bg: rgba(255, 255, 255, 0.85); /* 背景色に馴染むよう半透明白に変更 */
            --font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            letter-spacing: 0.05em;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .screen.active {
            display: block;
            opacity: 1;
        }

        /* ----- UI ----- */
        h1.main-title {
            font-size: 2.2rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 0.2em;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .start-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 2.5rem;
            line-height: 1.8;
            white-space: nowrap;
            width: 100%;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 18px 24px;
            background: #ffffff;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            background-color: transparent;
        }

        .btn-start {
            width: 100%;
        }

        .btn:hover {
            background: var(--text-main);
            color: #ffffff;
        }

        .btn:disabled {
            border-color: #ccc;
            color: #ccc;
            cursor: not-allowed;
            background: transparent;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-secondary {
            border-color: var(--border-color);
            color: var(--text-sub);
        }

        .btn-secondary:hover {
            background: #f0f0f0;
            color: var(--text-main);
            border-color: var(--text-main);
        }

        /* 質問カード */
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .q-number {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.15em;
        }

        .q-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 2rem;
        }

        .option-item {
            border: 1px solid var(--border-color);
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
            display: flex;
            align-items: center;
        }

        .option-item:hover {
            border-color: var(--accent-color);
        }

        .option-item.selected {
            background: var(--text-main);
            color: #fff;
            border-color: var(--text-main);
        }

        .option-key {
            font-weight: 900;
            margin-right: 15px;
            font-size: 1rem;
        }

        .option-text {
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* 画像アップロード */
        .file-upload-wrapper {
            margin-bottom: 2rem;
            text-align: center;
        }

        .file-input {
            display: none;
        }

        .file-label {
            border: 1px dashed var(--text-main);
            padding: 40px 20px;
            display: block;
            cursor: pointer;
            background: #fff;
            transition: background 0.2s;
        }

        .file-label:hover {
            background: #f9f9f9;
        }

        .preview-mini {
            max-width: 150px;
            max-height: 150px;
            margin: 15px auto 0;
            display: none;
            object-fit: cover;
        }

        /* ----- 最終結果カード (ポスターデザイン) ----- */
        .result-card-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        #result-card {
            background: #ffffff; /* JSで動的にグラデーション背景へ変更されます */
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border: 1px solid var(--text-main);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            box-sizing: border-box;
            text-align: center;
            transition: background 0.3s ease;
        }

        .card-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 0.25em;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .card-formula {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-bottom: 10px;
            border-top: 1px solid var(--text-main);
            border-bottom: 1px solid var(--text-main);
            padding: 10px 0;
            color: var(--text-main);
        }

        .card-sentence {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-main);
            white-space: nowrap;
        }

        .card-image-area {
            width: 100%;
            max-height: 380px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-image-area img {
            width: 100%;
            height: auto;
            max-height: 380px;
            object-fit: contain;
            display: block;
        }

        .card-description {
            text-align: left;
            font-size: 0.64rem;
            line-height: 1.75;
            letter-spacing: 0.02em;
            color: var(--text-main);
            word-break: keep-all;
            overflow-wrap: normal;
        }

        .desc-block {
            background-color: var(--desc-bg);
            padding: 12px 14px;
            border-radius: 4px;
            margin-bottom: 10px;
            backdrop-filter: blur(4px);
        }

        .desc-block:last-child {
            margin-bottom: 0;
        }

        .desc-line {
            white-space: nowrap;
            display: block;
            font-weight: 400;
        }

        .desc-bold {
            font-weight: 700;
        }

        .desc-keyword {
            margin-top: 4px;
            font-weight: 400;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- START SCREEN -->
    <div id="screen-start" class="screen active">
        <div class="start-container">
            <h1 class="main-title">私という作風</h1>
            <p class="subtitle">
                あなたは、何を美しいと思い、<br>
                何を通して表現し、<br>
                何を誰かにもたらしたい人？<br><br>
                18問の質問から、あなたの「創作の傾向」を診断します。
            </p>
            <button class="btn btn-start" onclick="startQuiz()">診断を開始する</button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="screen-quiz" class="screen">
        <div class="q-header">
            <span class="q-number" id="q-number">Q1 / 18</span>
        </div>
        <div class="q-title" id="q-title">質問タイトル</div>
        <div class="options-list" id="q-options"></div>
        <div class="btn-group">
            <button class="btn btn-secondary" id="btn-prev-q" onclick="prevQuestion()">一つ戻る</button>
        </div>
    </div>

    <!-- IMAGE UPLOAD SCREEN -->
    <div id="screen-image" class="screen">
        <div class="q-header">
            <span class="q-number">VISUAL</span>
        </div>
        <div class="q-title">キャラクター画像を選択</div>
        <div class="file-upload-wrapper">
            <label class="file-label" for="char-image-input">
                <span id="file-label-text">画像ファイルを選択 (ローカル処理)</span>
                <img id="preview-img" class="preview-mini" src="" alt="preview">
            </label>
            <input type="file" id="char-image-input" class="file-input" accept="image/*" onchange="handleImageUpload(event)">
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="prevScreenFromImage()">戻る</button>
            <button class="btn" id="btn-show-result" onclick="calculateAndShowResult()" disabled>結果を見る</button>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-result" class="screen">
        <div class="result-card-container">
            <div id="result-card">
                <div class="card-header">
                    <div class="card-title">私という作風</div>
                    <div class="card-formula" id="res-formula">[STYLE] × [MEDIUM] × [PURPOSE]</div>
                    <div class="card-sentence" id="res-sentence">［目的］、［美意識］を［手段を行う］人</div>
                </div>

                <div class="card-image-area">
                    <img id="res-image" src="" alt="Character">
                </div>

                <div class="card-description" id="res-description"></div>
            </div>
        </div>

        <div class="btn-group" style="flex-direction: column;">
            <button class="btn" onclick="downloadResultImage()">結果を画像でダウンロード</button>
            <button class="btn btn-secondary" onclick="restart()">最初からやり直す</button>
        </div>
    </div>

</div>

/* 優先順位リスト */
const STYLE_ORDER = ["再現", "理想", "表現", "知覚", "構成", "幻想", "概念", "変容"];
const MEDIUM_ORDER = ["視覚", "造形", "空間", "音響", "言語", "身体", "映像", "体験"];
const PURPOSE_ORDER = ["美", "探究", "伝達", "共感", "娯楽", "思索", "癒し", "感動"];

/* ==========================================================================
   APP STATE & CONTROL
   ========================================================================== */
let currentQuestionIndex = 0;
let userAnswers = [];
let uploadedImageData = null;

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function startQuiz() {
    currentQuestionIndex = 0;
    userAnswers = [];
    renderQuestion();
    showScreen('screen-quiz');
}

function renderQuestion() {
    const qData = QUESTIONS[currentQuestionIndex];
    document.getElementById('q-number').textContent = `Q${currentQuestionIndex + 1} / ${QUESTIONS.length}`;
    document.getElementById('q-title').textContent = qData.q;

    const optionsContainer = document.getElementById('q-options');
    optionsContainer.innerHTML = '';

    qData.answers.forEach((ans, idx) => {
        const item = document.createElement('div');
        item.className = 'option-item';
        if (userAnswers[currentQuestionIndex] === idx) {
            item.classList.add('selected');
        }
        item.innerHTML = `
            <span class="option-key">${ans.key}</span>
            <span class="option-text">${ans.text}</span>
        `;
        item.onclick = () => selectAnswer(idx);
        optionsContainer.appendChild(item);
    });

    const prevBtn = document.getElementById('btn-prev-q');
    if (currentQuestionIndex === 0) {
        prevBtn.textContent = "TOPへ戻る";
        prevBtn.onclick = () => showScreen('screen-start');
    } else {
        prevBtn.textContent = "一つ戻る";
        prevBtn.onclick = () => prevQuestion();
    }
}

function selectAnswer(index) {
    userAnswers[currentQuestionIndex] = index;
    if (currentQuestionIndex < QUESTIONS.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
    } else {
        showScreen('screen-image');
    }
}

function prevQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion();
    }
}

function prevScreenFromImage() {
    currentQuestionIndex = QUESTIONS.length - 1;
    renderQuestion();
    showScreen('screen-quiz');
}

function handleImageUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            uploadedImageData = e.target.result;
            const preview = document.getElementById('preview-img');
            preview.src = uploadedImageData;
            preview.style.display = 'block';
            document.getElementById('file-label-text').textContent = "画像を変更する";
            document.getElementById('btn-show-result').disabled = false;
        };
        reader.readAsDataURL(file);
    }
}

/* ==========================================================================
   SCORE AGGREGATION LOGIC
   ========================================================================== */
function calculateScores() {
    const scoreMap = {
        STYLE: {},
        MEDIUM: {},
        PURPOSE: {}
    };

    STYLE_ORDER.forEach(k => scoreMap.STYLE[k] = { total: 0, mainCount: 0, subCount: 0 });
    MEDIUM_ORDER.forEach(k => scoreMap.MEDIUM[k] = { total: 0, mainCount: 0, subCount: 0 });
    PURPOSE_ORDER.forEach(k => scoreMap.PURPOSE[k] = { total: 0, mainCount: 0, subCount: 0 });

    userAnswers.forEach((ansIdx, qIdx) => {
        if (ansIdx === undefined) return;
        const ans = QUESTIONS[qIdx].answers[ansIdx];
        
        const [mainCat, mainKey] = ans.main;
        if (scoreMap[mainCat][mainKey]) {
            scoreMap[mainCat][mainKey].total += 2;
            scoreMap[mainCat][mainKey].mainCount += 1;
        }

        const [subCat, subKey] = ans.sub;
        if (scoreMap[subCat][subKey]) {
            scoreMap[subCat][subKey].total += 1;
            scoreMap[subCat][subKey].subCount += 1;
        }
    });

    function getWinner(category, orderList) {
        const catMap = scoreMap[category];
        let winner = orderList[0];

        orderList.forEach(key => {
            if (key === winner) return;

            const current = catMap[key];
            const best = catMap[winner];

            if (current.total > best.total) {
                winner = key;
            } else if (current.total === best.total) {
                if (current.mainCount > best.mainCount) {
                    winner = key;
                } else if (current.mainCount === best.mainCount) {
                    if (current.subCount > best.subCount) {
                        winner = key;
                    }
                }
            }
        });

        return winner;
    }

    return {
        style: getWinner("STYLE", STYLE_ORDER),
        medium: getWinner("MEDIUM", MEDIUM_ORDER),
        purpose: getWinner("PURPOSE", PURPOSE_ORDER)
    };
}

/* HEXカラーをRGBAに変換する関数 (背景グラデーションを優しく見せるため) */
function hexToRgba(hex, alpha) {
    let c = hex.replace('#', '');
    if (c.length === 3) {
        c = c.split('').map(x => x + x).join('');
    }
    const num = parseInt(c, 16);
    const r = (num >> 16) & 255;
    const g = (num >> 8) & 255;
    const b = num & 255;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

/* ==========================================================================
   RESULT RENDER
   ========================================================================== */
function calculateAndShowResult() {
    if (!uploadedImageData) return;

    const res = calculateScores();
    const finalStyle = res.style;
    const finalMedium = res.medium;
    const finalPurpose = res.purpose;

    const colorS = COLOR_STYLE[finalStyle] || "#000000";
    const colorM = COLOR_MEDIUM[finalMedium] || "#000000";
    const colorP = COLOR_PURPOSE[finalPurpose] || "#000000";

    const pData = DATA_PURPOSE[finalPurpose];
    const mData = DATA_MEDIUM[finalMedium];
    const sData = DATA_STYLE[finalStyle];

    // 数式テキストを着色
    const formulaEl = document.getElementById('res-formula');
    formulaEl.innerHTML = `<span style="color: ${colorS}">${finalStyle}</span> × <span style="color: ${colorM}">${finalMedium}</span> × <span style="color: ${colorP}">${finalPurpose}</span>`;

    // 背景を三色が柔らかく混ざり合うグラデーションに適用
    const bgS = hexToRgba(colorS, 0.25);
    const bgM = hexToRgba(colorM, 0.25);
    const bgP = hexToRgba(colorP, 0.25);
    
    const cardEl = document.getElementById('result-card');
    cardEl.style.background = `linear-gradient(135deg, ${bgS} 0%, ${bgM} 50%, ${bgP} 100%)`;

    // 文章表示
    document.getElementById('res-sentence').textContent = `${pData.title}、${finalStyle}を${mData.action}人`;

    // 画像セット
    document.getElementById('res-image').src = uploadedImageData;

    // 説明文生成 ([STYLE] -> [MEDIUM] -> [PURPOSE] の順)
    const descContainer = document.getElementById('res-description');
    descContainer.innerHTML = '';

    // 1. [STYLE] ブロック
    let blockStyleHtml = `<div class="desc-block">`;
    blockStyleHtml += `<span class="desc-line desc-bold">${sData.desc1}</span>`;
    if (sData.desc2) blockStyleHtml += `<span class="desc-line">${sData.desc2}</span>`;
    if (sData.desc3) blockStyleHtml += `<span class="desc-line">${sData.desc3}</span>`;
    if (sData.desc4) blockStyleHtml += `<span class="desc-line">${sData.desc4}</span>`;
    blockStyleHtml += `<span class="desc-line" style="margin-top: 4px;">美意識：${sData.aesthetic}</span>`;
    blockStyleHtml += `<span class="desc-line">代表例：${sData.examples}</span>`;
    blockStyleHtml += `</div>`;

    // 2. [MEDIUM] ブロック
    let blockMediumHtml = `<div class="desc-block">`;
    blockMediumHtml += `<span class="desc-line desc-bold">${mData.desc1}</span>`;
    if (mData.desc2) blockMediumHtml += `<span class="desc-line">${mData.desc2}</span>`;
    blockMediumHtml += `<span class="desc-line">${mData.jobs}</span>`;
    blockMediumHtml += `</div>`;

    // 3. [PURPOSE] ブロック
    let blockPurposeHtml = `<div class="desc-block">`;
    blockPurposeHtml += `<span class="desc-line desc-bold">${pData.purposeText}</span>`;
    if (pData.desc2) blockPurposeHtml += `<span class="desc-line">${pData.desc2}</span>`;
    if (pData.desc3) blockPurposeHtml += `<span class="desc-line">${pData.desc3}</span>`;
    if (pData.desc4) blockPurposeHtml += `<span class="desc-line">${pData.desc4}</span>`;
    blockPurposeHtml += `<span class="desc-line desc-keyword">キーワード：${pData.keywords}</span>`;
    blockPurposeHtml += `</div>`;

    descContainer.innerHTML = blockStyleHtml + blockMediumHtml + blockPurposeHtml;

    showScreen('screen-result');
}
